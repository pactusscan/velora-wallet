# Builds a signed release APK and publishes a GitHub Release when a version tag
# (e.g. 0.1.5) is pushed. The tag becomes the app's version name, and changelog.md
# must have a matching "## [x.y.z]" section for the release notes.
#
# Required repository secrets:
#   VELORA_KEYSTORE_BASE64    base64 of the release keystore file
#   VELORA_KEYSTORE_PASSWORD  keystore password
#   VELORA_KEY_ALIAS          key alias
#   VELORA_KEY_PASSWORD       key password
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write
  packages: read # Trust Wallet Core is served from GitHub Packages

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Credentials for the GitHub Packages Maven repo in settings.gradle.kts
  GITHUB_USER: ${{ github.actor }}
  GITHUB_TOKEN: ${{ github.token }}
  # SHA-256 of the certificate that signed every published release so far.
  # A different key would stop updates from installing over existing versions.
  EXPECTED_CERT_SHA256: 553e611fe6fea29f75bc01ade9cc028480dfb5ad7c265a346ad48ade59f2d09d

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract release notes from changelog
        run: |
          awk -v ver="$GITHUB_REF_NAME" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' changelog.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::No '## [$GITHUB_REF_NAME]' section found in changelog.md"
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Restore signing keystore
        env:
          VELORA_KEYSTORE_BASE64: ${{ secrets.VELORA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$VELORA_KEYSTORE_BASE64" ]; then
            echo "::error::Secret VELORA_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$VELORA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          VELORA_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          VELORA_KEYSTORE_PASSWORD: ${{ secrets.VELORA_KEYSTORE_PASSWORD }}
          VELORA_KEY_ALIAS: ${{ secrets.VELORA_KEY_ALIAS }}
          VELORA_KEY_PASSWORD: ${{ secrets.VELORA_KEY_PASSWORD }}
          VELORA_VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signing certificate
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest:' | sed 's/.*digest: //')
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed with unexpected certificate: $actual"
            exit 1
          fi
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Velora Wallet v$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
